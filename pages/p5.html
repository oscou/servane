    <style>
        /* Style du lien secret au repos */
        .card p a.secret-link {
            color: inherit !important;       /* Même couleur que le texte autour */
            background: none !important;     /* Pas de fond rouge */
            padding: 0 !important;           /* Pas d'espacement de bouton */
            border-radius: 0 !important;     /* Pas d'arrondi */
            display: inline !important;      /* Reste dans la ligne du texte */
            text-decoration: none !important;/* Pas de soulignement */
            cursor: text !important;         /* Le curseur reste une barre de texte */
            box-shadow: none !important;     /* Pas d'ombre */
            transform: none !important;      /* Pas de mouvement */
        }
        
        /* CORRECTION ICI : Style du lien secret quand on passe la souris dessus */
        .card p a.secret-link:hover {
            color: inherit !important;       /* RESTE DE LA MÊME COULEUR, ne devient plus rouge */
            cursor: pointer !important;      /* OPTIONNEL : change le curseur en petite main pour qu'elle puisse cliquer si elle trouve le mot */
            background: none !important;     /* Garde le fond transparent */
            transform: none !important;      /* Pas de mouvement */
            box-shadow: none !important;     /* Pas d'ombre */
        }
    </style>
</head>
